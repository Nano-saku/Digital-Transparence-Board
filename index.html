<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b5c" />
    <link rel="icon" type="image/jpeg" href="/lsc-logo.jpg" />
    <title>LSynC — LSC Student Digital Board</title>
    <script>
      try {
        const saved = localStorage.getItem("dssc-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
